# coturn configuration for the webinar platform.
#
# Replace the public IP, realm and credentials before deploying.
# Clients receive these credentials through GET /api/rtc-config.

listening-port=3478
tls-listening-port=5349

# Public IP of the TURN host (required behind NAT).
external-ip=REPLACE_WITH_PUBLIC_IP

realm=webinar.local
server-name=webinar.local

# Long-term credential mechanism.
lt-cred-mech
user=webinar:REPLACE_WITH_STRONG_PASSWORD

# Restrict relayed ports to the range opened in the firewall.
min-port=49152
max-port=65535

# Disable multicast peers (security).
no-multicast-peers
no-cli

# Logging
log-file=stdout
simple-log

# TLS (optional — provide certificates to enable turns:)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
